<script type="text/html" data-help-name="waveshare-ad">
    <p>Analog-to-Digital Converter (ADC) node for Waveshare DA-AD HAT.</p>
    
    <h3>Inputs</h3>
    <p>The node accepts any message to trigger an ADC reading. The message content is ignored.</p>
    
    <h3>Configuration</h3>
    <ul>
        <li><strong>HAT Config:</strong> Select the Waveshare HAT Config node that manages the hardware</li>
        <li><strong>ADC Channel:</strong> Choose from 8 single-ended channels (0-7)</li>
        <li><strong>Gain:</strong> Programmable gain amplifier setting (1x to 64x)</li>
        <li><strong>Data Rate:</strong> Sampling rate from 2.5 to 30,000 samples per second (SPS)</li>
    </ul>
    
    <h3>Outputs</h3>
    <p>The node outputs a message with:</p>
    <ul>
        <li><code>payload.success</code>: Boolean indicating success/failure</li>
        <li><code>payload.channel</code>: ADC channel that was read</li>
        <li><code>payload.raw</code>: Raw ADC value (24-bit)</li>
        <li><code>payload.voltage_mv</code>: Calculated voltage in millivolts</li>
        <li><code>payload.gain</code>: Gain setting used</li>
        <li><code>payload.drate</code>: Data rate used</li>
        <li><code>payload.vref</code>: Reference voltage used</li>
        <li><code>payload.timestamp</code>: ISO timestamp of reading</li>
    </ul>
    
    <h3>Usage Examples</h3>
    
    <h4>Trigger ADC reading:</h4>
    <pre><code>{
    "payload": "read"  // Any message triggers a reading
}</code></pre>
    
    <h4>Output example:</h4>
    <pre><code>{
    "payload": {
        "success": true,
        "channel": 0,
        "raw": 8388607,
        "voltage_mv": 5000,
        "gain": 1,
        "drate": 10.0,
        "vref": 5.0,
        "timestamp": "2024-01-01T12:00:00.000Z"
    }
}</code></pre>
    
    <h3>Data Rate Guidelines</h3>
    <ul>
        <li><strong>Low rates (2.5-100 SPS):</strong> High precision, low noise</li>
        <li><strong>Medium rates (500-2000 SPS):</strong> Balanced precision and speed</li>
        <li><strong>High rates (3750-30000 SPS):</strong> High speed, lower precision</li>
    </ul>
    
    <h3>Voltage Calculation</h3>
    <p>The voltage is calculated using the formula:</p>
    <pre>voltage_mv = (raw_value / 8388607) * VREF * 1000</pre>
    
    <p><strong>Note:</strong> This node provides single-channel readings. For continuous monitoring, 
    use a timer or inject node to send periodic trigger messages.</p>
</script>
