<script type="text/javascript">
    RED.nodes.registerType('waveshare-da',{
        category: 'Waveshare HAT',
        color: '#C0DEED',
        defaults: {
            name: {value: ''},
            hatConfig: {value: '', type: 'waveshare-hat-config'},
            port: {value: 0},
            controlMode: {value: 'value'},
            vref: {value: 5.0}
        },
        inputs: 1,
        outputs: 1,
        icon: 'bridge.png',
        label: function() {
            return this.name || 'Waveshare DA';
        }
    });
</script>

<script type="text/html" data-template-name="waveshare-da">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Waveshare DA">
    </div>
    
    <div class="form-row">
        <label for="node-input-hatConfig"><i class="fa fa-cog"></i> HAT Config</label>
        <input type="text" id="node-input-hatConfig">
    </div>
    
    <div class="form-row">
        <label for="node-input-port"><i class="fa fa-plug"></i> DAC Port</label>
        <select id="node-input-port">
            <option value="0">DAC0 (Port 0)</option>
            <option value="1">DAC1 (Port 1)</option>
        </select>
    </div>
    
    <div class="form-row">
        <label for="node-input-controlMode"><i class="fa fa-sliders"></i> Control Mode</label>
        <select id="node-input-controlMode">
            <option value="value">Raw DAC Value (0-65535)</option>
            <option value="voltage">Voltage Output (0-VREF)</option>
        </select>
    </div>
    
    <div class="form-row">
        <label for="node-input-vref"><i class="fa fa-bolt"></i> Reference Voltage (V)</label>
        <input type="number" id="node-input-vref" min="1.0" max="10.0" step="0.1" value="5.0">
        <div class="help-info">Set the DAC reference voltage (1.0V to 10.0V)</div>
    </div>
</script>

<script type="text/html" data-help-name="waveshare-da">
    <p>Digital-to-Analog Converter (DAC) node for Waveshare DA-AD HAT.</p>
    
    <h3>Inputs</h3>
    <p>The node accepts a message with a <code>payload</code> containing either:</p>
    <ul>
        <li><strong>Raw DAC value:</strong> Integer between 0-65535 (16-bit resolution)</li>
        <li><strong>Voltage:</strong> Float voltage value in volts (0 to VREF)</li>
    </ul>
    
    <p><strong>Payload Override:</strong> You can also include configuration parameters in the message payload to override the node settings:</p>
    <ul>
        <li><code>payload.port</code>: DAC port (0 or 1)</li>
        <li><code>payload.controlMode</code>: 'value' or 'voltage'</li>
        <li><code>payload.vref</code>: Reference voltage in volts</li>
    </ul>
    
    <p><strong>Payload Override:</strong> You can also include configuration parameters in the message payload to override the node settings:</p>
    <ul>
        <li><code>payload.port</code>: DAC port (0 or 1)</li>
        <li><code>payload.controlMode</code>: 'value' or 'voltage'</li>
        <li><code>payload.vref</code>: Reference voltage in volts</li>
    </ul>
    
    <h3>Configuration</h3>
    <ul>
        <li><strong>HAT Config:</strong> Select the Waveshare HAT Config node that manages the hardware</li>
        <li><strong>DAC Port:</strong> Choose between DAC0 (Port 0) or DAC1 (Port 1)</li>
        <li><strong>Control Mode:</strong> Choose between raw DAC values or voltage output</li>
        <li><strong>Reference Voltage:</strong> Set the DAC reference voltage (1.0V to 10.0V)</li>
    </ul>
    
    <h3>Outputs</h3>
    <p>The node outputs a message with:</p>
    <ul>
        <li><code>payload.success</code>: Boolean indicating success/failure</li>
        <li><code>payload.port</code>: DAC port used</li>
        <li><code>payload.value</code>: Actual DAC value set (0-65535)</li>
        <li><code>payload.voltage_mv</code>: Output voltage in millivolts</li>
        <li><code>payload.timestamp</code>: ISO timestamp of operation</li>
    </ul>
    
    <h3>Usage Examples</h3>
    
    <h4>Set DAC to specific value:</h4>
    <pre><code>{
    "payload": 32768  // Set to mid-range (2.5V with 5V VREF)
}</code></pre>
    
    <h4>Set DAC to specific voltage:</h4>
    <pre><code>{
    "payload": 3.3  // Set to 3.3V
}</code></pre>
    
    <h4>Override configuration via payload:</h4>
    <pre><code>{
    "payload": 3.3,
    "port": 1,
    "controlMode": "voltage",
    "vref": 5.0
}</code></pre>
    
    <p><strong>Note:</strong> The control mode determines how the input is interpreted. 
    In "Raw DAC Value" mode, integer inputs are treated as DAC values. 
    In "Voltage Output" mode, float inputs are treated as target voltage.</p>
</script>
