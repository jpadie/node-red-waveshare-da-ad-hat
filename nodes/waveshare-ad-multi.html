<script type="text/javascript">
    RED.nodes.registerType('waveshare-ad-multi', {
        category: 'Waveshare HAT',
        color: '#87CEEB',
        defaults: {
            name: { value: '' },
            comparisons: { value: [], validate: function(v) { return Array.isArray(v) && v.length > 0; } },
            emissionFrequency: { value: 1.0, validate: function(v) { return !isNaN(v) && v > 0 && v <= 1000; } },
            outputFormat: { value: 'aggregated' }
        },
        inputs: 1,
        outputs: 1,
        icon: 'serial.png',
        label: function() {
            return this.name || `Multi-ADC (${this.comparisons.length} comparisons)`;
        },
        labelStyle: function() {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function() {
            const node = this;
            
            function createComparisonHTML(comparison, index) {
                const comp = comparison || {
                    name: `Comparison ${index + 1}`,
                    channel: 0,
                    differential: false,
                    negChannel: 8,
                    gain: 1,
                    buffered: false,
                    sps: 10.0
                };
                
                return `
                    <div class="comparison-item" data-index="${index}" style="
                        border: 1px solid #ddd; 
                        border-radius: 5px; 
                        padding: 15px; 
                        margin: 10px 0; 
                        background: #f9f9f9;
                    ">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <h4 style="margin: 0; color: #333;">${comp.name}</h4>
                            <div>
                                <button type="button" class="edit-comparison" data-index="${index}" style="
                                    background: #337ab7; color: white; border: none; padding: 5px 10px; 
                                    margin-right: 5px; border-radius: 3px; cursor: pointer;
                                ">Edit</button>
                                <button type="button" class="delete-comparison" data-index="${index}" style="
                                    background: #d9534f; color: white; border: none; padding: 5px 10px; 
                                    border-radius: 3px; cursor: pointer;
                                ">Delete</button>
                            </div>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; font-size: 13px;">
                            <div><strong>Channel:</strong> AIN${comp.channel}${comp.differential ? ` - AIN${comp.negChannel}` : ''}</div>
                            <div><strong>Mode:</strong> ${comp.differential ? 'Differential' : 'Single-ended'}${comp.buffered ? ' (Buffered)' : ''}</div>
                            <div><strong>Gain:</strong> ${comp.gain}x</div>
                            <div><strong>Sample Rate:</strong> ${comp.sps} SPS</div>
                            <div><strong>Range:</strong> ±${(2500 / comp.gain).toFixed(1)}mV</div>
                            <div><strong>Resolution:</strong> ${((2500 / comp.gain) / Math.pow(2, 23) * 2000).toFixed(3)}µV</div>
                        </div>
                    </div>
                `;
            }
            
            function renderComparisons() {
                const container = $('#comparisons-list');
                container.empty();
                
                if (node.comparisons.length === 0) {
                    container.html('<p style="text-align: center; color: #666; font-style: italic; padding: 20px;">No comparisons configured. Click "Add Comparison" to get started.</p>');
                } else {
                    node.comparisons.forEach((comp, index) => {
                        container.append(createComparisonHTML(comp, index));
                    });
                }
                
                $('.edit-comparison').click(function() {
                    const index = parseInt($(this).data('index'));
                    editComparison(index);
                });
                
                $('.delete-comparison').click(function() {
                    const index = parseInt($(this).data('index'));
                    if (confirm('Are you sure you want to delete this comparison?')) {
                        node.comparisons.splice(index, 1);
                        updateHiddenInput(); // Update hidden input to trigger dirty marking
                        renderComparisons();
                    }
                });
            }
            
            function editComparison(index) {
                const isNew = index === -1;
                const comparison = isNew ? {
                    name: `Comparison ${node.comparisons.length + 1}`,
                    channel: 0,
                    differential: false,
                    negChannel: 1,
                    gain: 1,
                    buffered: false,
                    sps: 10.0
                } : { ...node.comparisons[index] };
                
                const dialog = $(`
                    <div id="comparison-editor" style="
                        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
                        background: rgba(0,0,0,0.5); z-index: 10000; display: flex;
                        align-items: center; justify-content: center;
                    ">
                        <div style="
                            background: white; padding: 25px; border-radius: 8px; min-width: 500px;
                            max-height: 80vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
                        ">
                            <h3 style="margin-top: 0; color: #333;">${isNew ? 'Add New' : 'Edit'} Comparison</h3>
                            
                            <div style="margin-bottom: 15px;">
                                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Name:</label>
                                <input type="text" id="edit-name" value="${comparison.name}" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                            </div>
                            
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                                <div>
                                    <label style="display: block; margin-bottom: 5px; font-weight: bold;">Primary Channel:</label>
                                    <select id="edit-channel" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                                        <option value="0" ${comparison.channel === 0 ? 'selected' : ''}>AIN0</option>
                                        <option value="1" ${comparison.channel === 1 ? 'selected' : ''}>AIN1</option>
                                        <option value="2" ${comparison.channel === 2 ? 'selected' : ''}>AIN2</option>
                                        <option value="3" ${comparison.channel === 3 ? 'selected' : ''}>AIN3</option>
                                        <option value="4" ${comparison.channel === 4 ? 'selected' : ''}>AIN4</option>
                                        <option value="5" ${comparison.channel === 5 ? 'selected' : ''}>AIN5</option>
                                        <option value="6" ${comparison.channel === 6 ? 'selected' : ''}>AIN6</option>
                                        <option value="7" ${comparison.channel === 7 ? 'selected' : ''}>AIN7</option>
                                    </select>
                                </div>
                                
                                <div>
                                    <label style="display: block; margin-bottom: 5px; font-weight: bold;">Gain (PGA):</label>
                                    <select id="edit-gain" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                                        <option value="1" ${comparison.gain === 1 ? 'selected' : ''}>1x (±2500mV)</option>
                                        <option value="2" ${comparison.gain === 2 ? 'selected' : ''}>2x (±1250mV)</option>
                                        <option value="4" ${comparison.gain === 4 ? 'selected' : ''}>4x (±625mV)</option>
                                        <option value="8" ${comparison.gain === 8 ? 'selected' : ''}>8x (±312.5mV)</option>
                                        <option value="16" ${comparison.gain === 16 ? 'selected' : ''}>16x (±156.25mV)</option>
                                        <option value="32" ${comparison.gain === 32 ? 'selected' : ''}>32x (±78.125mV)</option>
                                        <option value="64" ${comparison.gain === 64 ? 'selected' : ''}>64x (±39.0625mV)</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div style="margin-bottom: 15px;">
                                <label style="display: flex; align-items: center; font-weight: bold;">
                                    <input type="checkbox" id="edit-differential" ${comparison.differential ? 'checked' : ''} style="margin-right: 8px;">
                                    Differential Mode
                                </label>
                            </div>
                            
                            <div id="neg-channel-section" style="margin-bottom: 15px; ${comparison.differential ? '' : 'display: none;'}">
                                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Negative Channel:</label>
                                <select id="edit-neg-channel" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                                    <option value="0" ${comparison.negChannel === 0 ? 'selected' : ''}>AIN0</option>
                                    <option value="1" ${comparison.negChannel === 1 ? 'selected' : ''}>AIN1</option>
                                    <option value="2" ${comparison.negChannel === 2 ? 'selected' : ''}>AIN2</option>
                                    <option value="3" ${comparison.negChannel === 3 ? 'selected' : ''}>AIN3</option>
                                    <option value="4" ${comparison.negChannel === 4 ? 'selected' : ''}>AIN4</option>
                                    <option value="5" ${comparison.negChannel === 5 ? 'selected' : ''}>AIN5</option>
                                    <option value="6" ${comparison.negChannel === 6 ? 'selected' : ''}>AIN6</option>
                                    <option value="7" ${comparison.negChannel === 7 ? 'selected' : ''}>AIN7</option>
                                    <option value="8" ${comparison.negChannel === 8 ? 'selected' : ''}>AINCOM (Common)</option>
                                </select>
                            </div>
                            
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                                <div>
                                    <label style="display: block; margin-bottom: 5px; font-weight: bold;">Sample Rate (SPS):</label>
                                    <select id="edit-sps" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                                        <option value="2.5" ${comparison.sps === 2.5 ? 'selected' : ''}>2.5 SPS</option>
                                        <option value="5" ${comparison.sps === 5 ? 'selected' : ''}>5 SPS</option>
                                        <option value="10" ${comparison.sps === 10 ? 'selected' : ''}>10 SPS</option>
                                        <option value="15" ${comparison.sps === 15 ? 'selected' : ''}>15 SPS</option>
                                        <option value="25" ${comparison.sps === 25 ? 'selected' : ''}>25 SPS</option>
                                        <option value="30" ${comparison.sps === 30 ? 'selected' : ''}>30 SPS</option>
                                        <option value="50" ${comparison.sps === 50 ? 'selected' : ''}>50 SPS</option>
                                        <option value="60" ${comparison.sps === 60 ? 'selected' : ''}>60 SPS</option>
                                        <option value="100" ${comparison.sps === 100 ? 'selected' : ''}>100 SPS</option>
                                        <option value="500" ${comparison.sps === 500 ? 'selected' : ''}>500 SPS</option>
                                        <option value="1000" ${comparison.sps === 1000 ? 'selected' : ''}>1000 SPS</option>
                                        <option value="2000" ${comparison.sps === 2000 ? 'selected' : ''}>2000 SPS</option>
                                        <option value="3750" ${comparison.sps === 3750 ? 'selected' : ''}>3750 SPS</option>
                                        <option value="7500" ${comparison.sps === 7500 ? 'selected' : ''}>7500 SPS</option>
                                        <option value="15000" ${comparison.sps === 15000 ? 'selected' : ''}>15000 SPS</option>
                                        <option value="30000" ${comparison.sps === 30000 ? 'selected' : ''}>30000 SPS</option>
                                    </select>
                                </div>
                                
                                <div>
                                    <label style="display: flex; align-items: center; font-weight: bold; margin-top: 25px;">
                                        <input type="checkbox" id="edit-buffered" ${comparison.buffered ? 'checked' : ''} style="margin-right: 8px;">
                                        Input Buffered
                                    </label>
                                </div>
                            </div>
                            
                            <div style="border-top: 1px solid #ddd; padding-top: 15px; text-align: right;">
                                <button type="button" id="cancel-edit" style="
                                    background: #6c757d; color: white; border: none; padding: 10px 20px; 
                                    margin-right: 10px; border-radius: 4px; cursor: pointer;
                                ">Cancel</button>
                                <button type="button" id="save-edit" style="
                                    background: #28a745; color: white; border: none; padding: 10px 20px; 
                                    border-radius: 4px; cursor: pointer;
                                ">Save</button>
                            </div>
                        </div>
                    </div>
                `);
                
                $('body').append(dialog);
                
                $('#edit-differential').change(function() {
                    if ($(this).prop('checked')) {
                        $('#neg-channel-section').show();
                        // If negChannel is 8 (AINCOM), set to 1 for differential mode
                        if ($('#edit-neg-channel').val() == '8') {
                            $('#edit-neg-channel').val('1');
                        }
                    } else {
                        $('#neg-channel-section').hide();
                        $('#edit-neg-channel').val(8);
                    }
                });
                
                $('#cancel-edit').click(function() {
                    dialog.remove();
                });
                
                $('#save-edit').click(function() {
                    const newComparison = {
                        name: $('#edit-name').val() || `Comparison ${node.comparisons.length + 1}`,
                        channel: parseInt($('#edit-channel').val()),
                        differential: $('#edit-differential').prop('checked'),
                        negChannel: parseInt($('#edit-neg-channel').val()),
                        gain: parseInt($('#edit-gain').val()),
                        buffered: $('#edit-buffered').prop('checked'),
                        sps: parseFloat($('#edit-sps').val())
                    };
                    
                    if (isNew) {
                        node.comparisons.push(newComparison);
                    } else {
                        node.comparisons[index] = newComparison;
                    }
                    
                    // Update hidden input to trigger Node-RED dirty marking
                    updateHiddenInput();
                    
                    dialog.remove();
                    renderComparisons();
                });
            }
            
            if (!node.comparisons) {
                node.comparisons = [];
            }
            
            // Initialize hidden input for Node-RED dirty tracking
            updateHiddenInput();
            
            // Sync function to update hidden input when comparisons change
            function updateHiddenInput() {
                $('#node-input-comparisons-json').val(JSON.stringify(node.comparisons));
            }
            
            $('#add-comparison').click(function() {
                editComparison(-1);
            });
            
            renderComparisons();
        },
        oneditsave: function() {
            // Parse comparisons from hidden input and update node properties
            const comparisonsJson = $('#node-input-comparisons-json').val();
            if (comparisonsJson) {
                try {
                    this.comparisons = JSON.parse(comparisonsJson);
                } catch (e) {
                    console.error('Failed to parse comparisons JSON:', e);
                }
            }
        }
    });
</script>

<script type="text/html" data-template-name="waveshare-ad-multi">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Multi-ADC Node">
    </div>
    
    <div class="form-row">
        <label for="node-input-emissionFrequency"><i class="fa fa-clock-o"></i> Emission Frequency (Hz)</label>
        <input type="number" id="node-input-emissionFrequency" placeholder="1.0" step="0.1" min="0.1" max="1000" style="width: 30%;">
        <span style="margin-left: 10px; color: #666;">How often to emit aggregated results</span>
    </div>
    
    <div class="form-row">
        <label for="node-input-outputFormat"><i class="fa fa-list"></i> Output Format</label>
        <select id="node-input-outputFormat" style="width: 30%;">
            <option value="aggregated">Aggregated (all comparisons in one message)</option>
            <option value="individual">Individual (separate message per comparison)</option>
        </select>
    </div>
    
    <div class="form-row">
        <label style="width: 100%; text-align: left;"><i class="fa fa-list"></i> ADC Comparisons</label>
        <div style="margin-top: 10px; margin-bottom: 15px;">
            <button type="button" id="add-comparison" style="
                background: #28a745; color: white; border: none; padding: 8px 15px; 
                border-radius: 4px; cursor: pointer; font-size: 14px;
            ">
                <i class="fa fa-plus"></i> Add Comparison
            </button>
        </div>
        <div id="comparisons-list" style="
            border: 1px solid #ddd; border-radius: 4px; min-height: 200px; 
            max-height: 400px; overflow-y: auto; padding: 10px; background: white;
        "></div>
        <!-- Hidden input for Node-RED dirty tracking -->
        <input type="hidden" id="node-input-comparisons-json" value="">
    </div>
    
    <div class="form-tips">
        <p><strong>Tips:</strong></p>
        <ul>
            <li>Click "Add Comparison" to configure multiple ADC channels with individual settings</li>
            <li>Each comparison shows its voltage range and resolution based on gain setting</li>
            <li>Use differential mode to measure voltage differences between channels</li>
            <li>The node processes comparisons in round-robin fashion continuously</li>
        </ul>
    </div>
</script>

<script type="text/html" data-help-name="waveshare-ad-multi">
    <p>Multi-channel ADC comparison node for the Waveshare DA/AD HAT with a clean, spacious UI.</p>
    
    <h3>Features</h3>
    <ul>
        <li>Intuitive list-based UI with edit/delete buttons for each comparison</li>
        <li>Modal dialog editor with full visibility of all configuration fields</li>
        <li>Visual summary showing channel, mode, gain, voltage range, and resolution</li>
        <li>Support for both single-ended and differential measurements</li>
        <li>Round-robin processing with configurable emission frequency</li>
    </ul>
    
    <h3>UI Improvements</h3>
    <ul>
        <li><strong>Spacious Layout:</strong> No more cramped tiny boxes</li>
        <li><strong>Clear List View:</strong> Each comparison shown as a card with all key info</li>
        <li><strong>Modal Editor:</strong> Full-screen editing dialog for all parameters</li>
        <li><strong>Visual Feedback:</strong> Shows calculated voltage range and resolution</li>
        <li><strong>Easy Management:</strong> Clear Add/Edit/Delete buttons</li>
    </ul>
    
    <h3>Configuration Fields</h3>
    <p>All fields are clearly visible and accessible:</p>
    <ul>
        <li><strong>Name:</strong> Descriptive name for each comparison</li>
        <li><strong>Primary Channel:</strong> AIN0-AIN7 selection</li>
        <li><strong>Gain (PGA):</strong> 1x to 64x with voltage range display</li>
        <li><strong>Differential Mode:</strong> Checkbox with negative channel selection</li>
        <li><strong>Sample Rate:</strong> 2.5 to 30000 SPS</li>
        <li><strong>Input Buffered:</strong> Enable/disable input buffering</li>
    </ul>
</script>
