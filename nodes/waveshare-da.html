<script type="text/javascript">
    RED.nodes.registerType('waveshare-da',{
        category: 'Waveshare HAT',
        color: '#C0DEED',
        defaults: {
            name: {value: ''},
            hatConfig: {value: ''},
            port: {value: 0}
        },
        inputs: 1,
        outputs: 1,
        icon: 'bridge.png',
        label: function() {
            return this.name || 'Waveshare DA';
        }
    });
</script>

<script type="text/html" data-template-name="waveshare-da">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Waveshare DA">
    </div>
    
    <div class="form-row">
        <label for="node-input-hatConfig"><i class="fa fa-cog"></i> HAT Config</label>
        <input type="text" id="node-input-hatConfig" placeholder="Select HAT Config">
    </div>
    
    <div class="form-row">
        <label for="node-input-port"><i class="fa fa-plug"></i> DAC Port</label>
        <select id="node-input-port">
            <option value="0">DAC0 (Port 0)</option>
            <option value="1">DAC1 (Port 1)</option>
        </select>
    </div>
</script>

<script type="text/html" data-help-name="waveshare-da">
    <p>Digital-to-Analog Converter (DAC) node for Waveshare DA-AD HAT.</p>
    
    <h3>Inputs</h3>
    <p>The node accepts a message with a <code>payload</code> containing either:</p>
    <ul>
        <li><strong>Raw DAC value:</strong> Integer between 0-65535 (16-bit resolution)</li>
        <li><strong>Voltage:</strong> Float voltage value in volts (0 to VREF)</li>
    </ul>
    
    <h3>Configuration</h3>
    <ul>
        <li><strong>HAT Config:</strong> Select the Waveshare HAT Config node that manages the hardware</li>
        <li><strong>DAC Port:</strong> Choose between DAC0 (Port 0) or DAC1 (Port 1)</li>
    </ul>
    
    <h3>Outputs</h3>
    <p>The node outputs a message with:</p>
    <ul>
        <li><code>payload.success</code>: Boolean indicating success/failure</li>
        <li><code>payload.port</code>: DAC port used</li>
        <li><code>payload.value</code>: Actual DAC value set (0-65535)</li>
        <li><code>payload.voltage_mv</code>: Output voltage in millivolts</li>
        <li><code>payload.timestamp</code>: ISO timestamp of operation</li>
    </ul>
    
    <h3>Usage Examples</h3>
    
    <h4>Set DAC to specific value:</h4>
    <pre><code>{
    "payload": 32768  // Set to mid-range (2.5V with 5V VREF)
}</code></pre>
    
    <h4>Set DAC to specific voltage:</h4>
    <pre><code>{
    "payload": 3.3  // Set to 3.3V
}</code></pre>
    
    <p><strong>Note:</strong> The control mode (raw value vs. voltage) is automatically determined based on the input type. 
    Integer inputs are treated as raw DAC values, float inputs are treated as voltage values.</p>
</script>
