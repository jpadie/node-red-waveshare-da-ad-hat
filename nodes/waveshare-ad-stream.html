<script type="text/javascript">
    RED.nodes.registerType('waveshare-ad-stream',{
        category: 'Waveshare HAT',
        color: '#C0DEED',
        defaults: {
            name: {value: ''},
            channelsCsv: {value: '0,2,3'},
            sharedGain: {value: 1},
            sharedDrate: {value: 25},
            sharedBuffered: {value: false},
            emitRateHz: {value: 1},
            streamId: {value: ''},
            channelJson: {value: ''}
        },
        inputs: 0,
        outputs: 1,
        icon: 'bridge.png',
        label: function() {
            return this.name || 'Waveshare AD Stream';
        },
        oneditprepare: function() {
            if (!$('#node-input-streamId').val()) {
                $('#node-input-streamId').val('stream-' + (Math.random().toString(36).slice(2, 8)));
            }
        }
    });
</script>

<script type="text/html" data-template-name="waveshare-ad-stream">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Waveshare AD Stream">
    </div>

    <div class="form-row">
        <label for="node-input-channelsCsv"><i class="fa fa-list"></i> Channels (CSV)</label>
        <input type="text" id="node-input-channelsCsv" placeholder="e.g. 0,2,3">
        <div class="help">List of channels to sample in order.</div>
    </div>

    <div class="form-row">
        <label for="node-input-sharedGain"><i class="fa fa-signal"></i> Shared Gain</label>
        <select id="node-input-sharedGain">
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
            <option value="8">8x</option>
            <option value="16">16x</option>
            <option value="32">32x</option>
            <option value="64">64x</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-sharedDrate"><i class="fa fa-tachometer-alt"></i> Shared DRATE (SPS)</label>
        <select id="node-input-sharedDrate">
            <option value="2.5">2.5</option>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="25">25</option>
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="60">60</option>
            <option value="100">100</option>
            <option value="500">500</option>
            <option value="1000">1000</option>
            <option value="2000">2000</option>
            <option value="3750">3750</option>
            <option value="7500">7500</option>
            <option value="15000">15000</option>
            <option value="30000">30000</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-sharedBuffered"><i class="fa fa-filter"></i> Buffered</label>
        <input type="checkbox" id="node-input-sharedBuffered">
    </div>

    <div class="form-row">
        <label for="node-input-emitRateHz"><i class="fa fa-clock-o"></i> Emit Rate (Hz)</label>
        <input type="number" id="node-input-emitRateHz" min="0.2" max="10" step="0.1">
    </div>

    <div class="form-row">
        <label for="node-input-streamId"><i class="fa fa-link"></i> Stream ID</label>
        <input type="text" id="node-input-streamId" placeholder="auto">
        <div class="help">Used to match samples from the worker to this node.</div>
    </div>

    <div class="form-row">
        <label for="node-input-channelJson"><i class="fa fa-code"></i> Advanced Channel JSON</label>
        <input type="text" id="node-input-channelJson" placeholder='[{"ch":0,"differential":false,"neg":8,"gain":1,"drate":25,"buffered":false}]'>
        <div class="help">Optional JSON array for per-channel differential, neg, gain, drate, buffered. Overrides shared settings.</div>
    </div>
</script>

<script type="text/html" data-help-name="waveshare-ad-stream">
    <p>Continuously reads multiple ADS1256 channels and emits samples at a fixed rate.</p>
    <ul>
        <li><strong>Channels (CSV)</strong>: e.g. <code>0,2,3</code></li>
        <li><strong>Shared Gain/DRATE/Buffered</strong>: Applied to channels unless overridden in Advanced JSON</li>
        <li><strong>Emit Rate</strong>: Target rate for a full cycle across configured channels</li>
        <li><strong>Stream ID</strong>: Correlates worker events to this node</li>
        <li><strong>Advanced Channel JSON</strong>: Optional array of objects per channel</li>
    </ul>
</script>
